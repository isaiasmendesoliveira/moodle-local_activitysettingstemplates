name: Build Moodle JavaScript Assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          path: plugin
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, zip, gd, soap
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"

      - name: Install Moodle and plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: MOODLE_405_STABLE

      - name: Build AMD files with Moodle Grunt
        shell: bash
        run: |
          set -euo pipefail

          if [ -d moodle/public/local/activitysettingstemplates ]; then
            component_root="public/local/activitysettingstemplates"
          elif [ -d moodle/local/activitysettingstemplates ]; then
            component_root="local/activitysettingstemplates"
          else
            echo "Activity Settings Templates component directory was not found."
            exit 1
          fi

          cd moodle
          npx grunt amd --root="$component_root"
          cd ..

          mkdir -p plugin/amd/build
          rm -f plugin/amd/build/*.js plugin/amd/build/*.js.map
          cp -v "moodle/$component_root"/amd/build/*.js plugin/amd/build/
          cp -v "moodle/$component_root"/amd/build/*.js.map plugin/amd/build/

          echo "Generated AMD assets:"
          ls -la plugin/amd/build
          git -C plugin status --short amd/build

      - name: Commit generated AMD files
        working-directory: plugin
        shell: bash
        run: |
          set -euo pipefail
          git add amd/build
          if git diff --cached --quiet; then
            echo "AMD build files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Moodle AMD assets"
          git push
